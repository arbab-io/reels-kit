name: Publish to GitHub Packages

# Publishes a copy of the package to GitHub's own npm registry so it shows in
# the repository's "Packages" sidebar. GitHub requires the package name to use
# the repository owner's scope, so the copy is named @arbab-io/reels-kit.
# The package on npmjs.com is published separately and keeps the name
# "reels-kit".

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      - name: Point npm at GitHub Packages
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@arbab-io'

      - name: Use the scoped package name
        run: |
          npm pkg set name=@arbab-io/reels-kit
          npm pkg set publishConfig.registry=https://npm.pkg.github.com

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
